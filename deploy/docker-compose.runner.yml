# Self-hosted GitHub Actions runner for the CI `deploy` job only (owner decision 2026-09-11,
# docs/IMPLEMENTATION_PLAN.md Milestone 20). Deliberately separate from docker-compose.portainer.yml
# / Portainer: this is a CI utility, not part of the application, and its only real secret
# (RUNNER_TOKEN) is short-lived (~1hr) and only matters at first registration — a poor fit for
# Portainer's "persistent stack env var" model. Bring it up directly over SSH/docker compose, not
# through Portainer.
#
# `network_mode: host`: the whole point of this runner is to reach `watchtower`'s HTTP API, which
# is published loopback-only (127.0.0.1) on this same box precisely so it's reachable from nothing
# else — this runner needs to see the host's actual 127.0.0.1, not its own container-local
# loopback, so it has to share the host's network namespace. It does not need Docker access itself
# (the `deploy` CI job is a single `curl` call, nothing more) — no docker.sock mount here.
#
# One-time setup (run these yourself — this file's RUNNER_TOKEN must never be committed):
#   1. GitHub → this repo → Settings → Actions → Runners → New self-hosted runner → copy the
#      registration token shown (valid ~1 hour, single use).
#   2. On this box: `export RUNNER_TOKEN=<paste>` then
#      `docker compose -f deploy/docker-compose.runner.yml up -d`
#   3. Confirm it shows as "Idle" under Settings → Actions → Runners before relying on it.
# If the container is ever recreated later (not just restarted), repeat steps 1-2 with a fresh
# token — a running container stays registered indefinitely on its own.

services:
  deploy-runner:
    # Community image providing the auto-registration env-var wrapper around GitHub's official
    # runner — verify this tag still exists on Docker Hub before first use and adjust if not
    # (myoung34/github-runner doesn't publish the same strict semver-tag discipline this project
    # otherwise requires; pin whatever the current stable tag actually is).
    image: myoung34/github-runner:2.319.1
    restart: unless-stopped
    network_mode: host
    environment:
      REPO_URL: https://github.com/eps125/railway-live-maps
      RUNNER_NAME: railway-live-map-box
      RUNNER_TOKEN: ${RUNNER_TOKEN:?RUNNER_TOKEN is required — see this file's setup comment}
      RUNNER_SCOPE: repo
      # Matches the `runs-on: [self-hosted, railway-live-maps-deploy]` label in
      # .github/workflows/ci.yml's deploy job — only that job is ever dispatched here.
      LABELS: railway-live-maps-deploy
      RUNNER_WORKDIR: /tmp/runner/work
      EPHEMERAL: "false"
    volumes:
      - runner_work:/tmp/runner/work

volumes:
  runner_work:
