# Pull-only variant of docker-compose.yml for Portainer: no `build:` context, images come
# straight from GHCR. Use this file (not docker-compose.yml) when deploying via Portainer's
# "Repository" stack method pointing at this repo, or by pasting it into the Web editor.
# APP_TAG defaults to `latest` (deploy/.env.example) — a deliberate owner choice for this
# single-operator deployment, not the general production advice docs/ARCHITECTURE.md §8 gives
# (pin to a real commit SHA once you trust a build) for a multi-operator/higher-stakes setup.
#
# Deliberately has no Docker-secret file mounts (no host filesystem access required to
# deploy) — NR_USERNAME/NR_PASSWORD are plain environment variables (Portainer's stack
# environment editor) instead of mounted secret files. Weaker than a mounted secret (visible
# via `docker inspect`/the Portainer UI to anyone with stack access) — see deploy/DEPLOYMENT.md
# §4's caveat. Every `*_LIVE_ENABLED` flag below now defaults to `true` (deploy/.env.example)
# — also a deliberate owner choice once TD/VSTP/TRUST were confirmed working against real NR
# feeds; NR_USERNAME/NR_PASSWORD must still be set in Portainer's stack environment editor for
# any of the three to actually connect (loadConfig fails fast otherwise).
#
# `worker` itself stays an idle daemon (its default command) — it's the stable target for
# Portainer's "Console" one-off commands (migrate, ensure-archive-bucket, publish-map, ...).
# Actual live ingestion runs in the three dedicated `ingest-*` services below: each is always
# running, but its shell wrapper idles (`sleep infinity`) rather than connecting whenever its
# own `*_LIVE_ENABLED` flag is false, so leaving them at the default is a safe no-op rather
# than a crash loop. `projector-td` and `projector-resolver` run persistent daemons
# (`project-td-daemon` / `project-resolver-daemon`, 2026-09 live-path hardening) that tick every
# 250-500ms in one warm process — no per-cycle `node` cold start. `projector-schedule` still
# re-runs the one-shot `project-vstp`/`project-trust` commands in a shell loop (there is no
# built-in scheduler yet). Split into separate services so live berth positions and resolver
# latency can never be stalled by schedule/TRUST backlog work, or each other (see the comments on
# each service below).
#
# Postgres/Redis/archive are published to the host below for direct testing access — this
# is a deliberate departure from docs/ARCHITECTURE.md §12 ("only the reverse proxy/web entry
# point should be public"; internal services stay off the internal `backend` network's
# public surface otherwise). Fine for a single-operator testing/staging box; put these
# behind a firewall or VPN rather than a raw public IP, and don't reuse this file as-is for
# a production deployment without reconsidering that tradeoff.
#
# `backend` is `internal: true` (no route to the outside world at all — not even DNS), which
# is right for Postgres/Redis/archive/api/web but would silently break `worker` and the three
# `ingest-*` services: they need to actually reach publicdatafeeds.networkrail.co.uk. Those
# services are additionally attached to `egress`, a normal (non-internal) network that grants
# outbound internet without publishing anything new inbound — see its definition below.

name: railway-live-maps

x-worker-env: &worker-env
  APP_ENV: ${APP_ENV:-production}
  DATABASE_URL: ${DATABASE_URL}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379}
  CAPTURE_ALL_TD: ${CAPTURE_ALL_TD:-true}
  RAW_ARCHIVE_ENDPOINT: ${RAW_ARCHIVE_ENDPOINT:-http://archive:9000}
  RAW_ARCHIVE_BUCKET: ${RAW_ARCHIVE_BUCKET:-railway-raw}
  RAW_ARCHIVE_ACCESS_KEY: ${RAW_ARCHIVE_ACCESS_KEY}
  RAW_ARCHIVE_SECRET_KEY: ${RAW_ARCHIVE_SECRET_KEY}
  RAW_ARCHIVE_REGION: ${RAW_ARCHIVE_REGION:-us-east-1}
  NR_TD_TOPIC: ${NR_TD_TOPIC:-/topic/TD_ALL_SIG_AREA}
  NR_TRUST_TOPIC: ${NR_TRUST_TOPIC:-/topic/TRAIN_MVT_ALL_TOC}
  NR_VSTP_TOPIC: ${NR_VSTP_TOPIC:-/topic/VSTP_ALL}
  # Real values go in Portainer's stack environment editor, never in this file or Git.
  NR_USERNAME: ${NR_USERNAME:-}
  NR_PASSWORD: ${NR_PASSWORD:-}
  TD_LIVE_ENABLED: ${TD_LIVE_ENABLED:-true}
  VSTP_LIVE_ENABLED: ${VSTP_LIVE_ENABLED:-true}
  TRUST_LIVE_ENABLED: ${TRUST_LIVE_ENABLED:-true}
  # SCHEDULE/CORPUS/SMART full-extract download support (docs/IMPLEMENTATION_PLAN.md
  # Milestone 7) — previously missing from this anchor entirely, so setting
  # SCHEDULE_DOWNLOAD_ENABLED in Portainer's stack environment editor silently had no effect
  # (docker compose only injects env vars a service's `environment:` block actually
  # references). Gates both the manual download-{schedule,smart,corpus} console commands AND
  # the always-running `reference-data-refresh` service below, which calls all three
  # automatically once a day at REFERENCE_DATA_REFRESH_TIME — same on/off discipline as
  # TD/VSTP/TRUST_LIVE_ENABLED (2026-08-13: previously this flag really did trigger nothing on
  # its own, before that service existed).
  NR_SCHEDULE_DOWNLOAD_URL: ${NR_SCHEDULE_DOWNLOAD_URL:-https://publicdatafeeds.networkrail.co.uk/ntrod/CifFileAuthenticate?type=CIF_ALL_FULL_DAILY&day=toc-full}
  NR_CORPUS_DOWNLOAD_URL: ${NR_CORPUS_DOWNLOAD_URL:-https://publicdatafeeds.networkrail.co.uk/ntrod/SupportingFileAuthenticate?type=CORPUS}
  NR_SMART_DOWNLOAD_URL: ${NR_SMART_DOWNLOAD_URL:-https://publicdatafeeds.networkrail.co.uk/ntrod/SupportingFileAuthenticate?type=SMART}
  SCHEDULE_DOWNLOAD_ENABLED: ${SCHEDULE_DOWNLOAD_ENABLED:-true}
  # Europe/London wall-clock time (24h HH:MM) the reference-data-refresh service below runs
  # download-schedule/download-smart/download-corpus at, once a day. Only takes effect while
  # SCHEDULE_DOWNLOAD_ENABLED is true — see that service's own comment.
  REFERENCE_DATA_REFRESH_TIME: ${REFERENCE_DATA_REFRESH_TIME:-01:00}
  # Must match the `api` service's own copy of this flag below — and gates whether
  # `project-td-daemon` publishes map deltas to Redis after each projection tick (see the
  # projector-td service and docs/ARCHITECTURE.md's Milestone 6 note). On: the WebSocket layer
  # gets pushed deltas over Redis pub/sub instead of polling Postgres, which is what actually
  # makes the map feel live rather than merely "polls a bit faster."
  LIVE_WS_REDIS_PUBSUB_ENABLED: ${LIVE_WS_REDIS_PUBSUB_ENABLED:-true}
  # garner bridge (ADR 0002): the `ingest-garner` service mirrors CORPUS/SMART (and, once wired,
  # CIF-schedule + TRUST) from the operator's openrail-eps MariaDB instead of RLM subscribing to
  # Network Rail a second time. Off by default. When true, GARNER_DB_* must be set in Portainer's
  # stack env and should be a read-only user (openrail-eps docker/README "External read access").
  GARNER_BRIDGE_ENABLED: ${GARNER_BRIDGE_ENABLED:-false}
  GARNER_DB_HOST: ${GARNER_DB_HOST:-}
  GARNER_DB_PORT: ${GARNER_DB_PORT:-3306}
  GARNER_DB_NAME: ${GARNER_DB_NAME:-rail}
  GARNER_DB_USER: ${GARNER_DB_USER:-}
  GARNER_DB_PASSWORD: ${GARNER_DB_PASSWORD:-}
  GARNER_BRIDGE_BACKFILL_DAYS: ${GARNER_BRIDGE_BACKFILL_DAYS:-14}
  # Milestone 15 step 5: eager berth-run resolution is scoped to areas a published map binds.
  RESOLVER_EAGER_MAPPED_AREAS_ONLY: ${RESOLVER_EAGER_MAPPED_AREAS_ONLY:-true}
  # The `project-resolver` live loop only resolves berth occupancies entered within this many
  # hours (default 72). Keeps a RESOLVER_VERSION bump — which starts a fresh resolver checkpoint
  # at 0 — from grinding oldest-first through every retained nationwide day before the live map
  # reflects "now". Not an ingestion filter: ingestion and the TD/berth-occupancy projections
  # stay fully nationwide; older resolver history is caught up on demand with
  # `project-resolver --backfill --since <YYYY-MM-DD>` (its own advisory lock, so it runs
  # alongside the 1s loop). `project-resolver --rebuild` ignores this window.
  RESOLVER_LIVE_WINDOW_HOURS: ${RESOLVER_LIVE_WINDOW_HOURS:-72}

services:
  web:
    image: ${WEB_IMAGE:-ghcr.io/eps125/railway-live-maps-web}:${APP_TAG:-latest}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-6050}:80"
    networks: [frontend, backend]

  api:
    image: ${API_IMAGE:-ghcr.io/eps125/railway-live-maps-api}:${APP_TAG:-latest}
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-production}
      # Internal container listen port — NOT the same thing as API_PORT below (which is only
      # the host-side publish mapping, hardcoded to forward to container port 3000). Leave
      # PORT at 3000: apps/web/nginx.conf's `proxy_pass http://api:3000` is hardcoded to that
      # value, so changing PORT here breaks the web->api proxy with a 502, even though the
      # api container itself comes up healthy.
      PORT: ${PORT:-3000}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      DISPLAY_TIMEZONE: ${DISPLAY_TIMEZONE:-Europe/London}
      EDITOR_ENABLED: ${EDITOR_ENABLED:-true}
      # Must match the worker-side copy of this flag (x-worker-env above) — if only one side
      # has it on, deltas either never get published or never get subscribed to.
      LIVE_WS_REDIS_PUBSUB_ENABLED: ${LIVE_WS_REDIS_PUBSUB_ENABLED:-true}
      # Previously missing from this block entirely (apps/api/src/config.ts has both with safe
      # defaults, so nothing broke — but Portainer's environment editor couldn't actually
      # override them). LIVE_WS_POLL_INTERVAL_MS is also the fallback poll interval when
      # LIVE_WS_REDIS_PUBSUB_ENABLED is false.
      LIVE_WS_POLL_INTERVAL_MS: ${LIVE_WS_POLL_INTERVAL_MS:-1000}
      LIVE_WS_HEARTBEAT_INTERVAL_MS: ${LIVE_WS_HEARTBEAT_INTERVAL_MS:-15000}
    ports:
      - "${API_PORT:-6051}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "dist/healthcheck.js"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [backend]

  worker:
    image: ${WORKER_IMAGE:-ghcr.io/eps125/railway-live-maps-worker}:${APP_TAG:-latest}
    restart: unless-stopped
    environment: *worker-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      archive:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "dist/healthcheck.js"]
      interval: 30s
      timeout: 5s
      retries: 5
    # `egress` (not `internal`-only): this is also the console target for one-off
    # `download-schedule`/`download-corpus`/`download-smart` commands, which reach
    # publicdatafeeds.networkrail.co.uk directly — same requirement as the ingest-* services.
    networks: [backend, egress]

  # Always running; idles (sleep infinity) unless TD_LIVE_ENABLED=true, in which case it
  # connects to the real Network Rail TD feed. Flip the flag and redeploy this service (no
  # image change needed) to start/stop live capture.
  ingest-td:
    image: ${WORKER_IMAGE:-ghcr.io/eps125/railway-live-maps-worker}:${APP_TAG:-latest}
    restart: unless-stopped
    environment: *worker-env
    command:
      - sh
      - -c
      - |
        if [ "$$TD_LIVE_ENABLED" = "true" ]; then
          exec node dist/index.js ingest-td
        else
          echo "ingest-td: TD_LIVE_ENABLED is not true, idling"
          exec sleep infinity
        fi
    depends_on:
      postgres:
        condition: service_healthy
      archive:
        condition: service_started
    # The image's baked-in HEALTHCHECK reads a heartbeat file only the idle `serve` role
    # writes — it does not apply to this role, so it's disabled here rather than showing a
    # permanently "unhealthy" status for a container that's actually working correctly.
    healthcheck:
      disable: true
    # `egress` (not `internal`) is required here — this is the one role that must reach the
    # real internet (Network Rail's public STOMP endpoint). `backend`-only would leave it
    # unable to resolve any hostname at all (DNS EAI_AGAIN), not merely blocked.
    networks: [backend, egress]

  ingest-vstp:
    image: ${WORKER_IMAGE:-ghcr.io/eps125/railway-live-maps-worker}:${APP_TAG:-latest}
    restart: unless-stopped
    environment: *worker-env
    command:
      - sh
      - -c
      - |
        if [ "$$VSTP_LIVE_ENABLED" = "true" ]; then
          exec node dist/index.js ingest-vstp
        else
          echo "ingest-vstp: VSTP_LIVE_ENABLED is not true, idling"
          exec sleep infinity
        fi
    depends_on:
      postgres:
        condition: service_healthy
      archive:
        condition: service_started
    healthcheck:
      disable: true
    # See ingest-td above: needs real internet access to reach Network Rail.
    networks: [backend, egress]

  ingest-trust:
    image: ${WORKER_IMAGE:-ghcr.io/eps125/railway-live-maps-worker}:${APP_TAG:-latest}
    restart: unless-stopped
    environment: *worker-env
    command:
      - sh
      - -c
      - |
        if [ "$$TRUST_LIVE_ENABLED" = "true" ]; then
          exec node dist/index.js ingest-trust
        else
          echo "ingest-trust: TRUST_LIVE_ENABLED is not true, idling"
          exec sleep infinity
        fi
    depends_on:
      postgres:
        condition: service_healthy
      archive:
        condition: service_started
    healthcheck:
      disable: true
    # See ingest-td above: needs real internet access to reach Network Rail.
    networks: [backend, egress]

  # Automatically re-downloads/re-imports SCHEDULE, SMART and CORPUS once a day at
  # REFERENCE_DATA_REFRESH_TIME (Europe/London, default 01:00) — previously the only way to
  # refresh reference data was running download-schedule/download-smart/download-corpus by hand
  # via Portainer's Console (docs/IMPLEMENTATION_PLAN.md Milestone 7). Idles (sleep infinity)
  # unless SCHEDULE_DOWNLOAD_ENABLED=true, same pattern as ingest-td/vstp/trust above — flip the
  # flag and redeploy to start automatic daily refreshes. A failed night is logged and retried the
  # following day rather than crash-looping the container (apps/worker/src/commands/
  # scheduleReferenceRefresh.ts).
  reference-data-refresh:
    image: ${WORKER_IMAGE:-ghcr.io/eps125/railway-live-maps-worker}:${APP_TAG:-latest}
    restart: unless-stopped
    environment: *worker-env
    command:
      - sh
      - -c
      - |
        if [ "$$SCHEDULE_DOWNLOAD_ENABLED" = "true" ]; then
          exec node dist/index.js schedule-reference-refresh
        else
          echo "reference-data-refresh: SCHEDULE_DOWNLOAD_ENABLED is not true, idling"
          exec sleep infinity
        fi
    depends_on:
      postgres:
        condition: service_healthy
      archive:
        condition: service_started
    healthcheck:
      disable: true
    # `egress` (not `internal`): reaches publicdatafeeds.networkrail.co.uk directly, same
    # requirement as ingest-td/vstp/trust and the worker service's own console commands.
    networks: [backend, egress]

  # Live berth-position + map-delta path, as one persistent process (2026-09 live-path
  # hardening). Replaces the previous `projector-td` and `map-deltas` services, which each ran
  # `while true; do node dist/index.js <cmd>; sleep 1; done` — a full node cold start (~0.5-1s)
  # every cycle was the dominant contributor to end-to-end live-map latency, and the two
  # independent `sleep 1` loops could drift out of phase and stack their waits. `project-td-daemon`
  # runs runProjectTd then (when LIVE_WS_REDIS_PUBSUB_ENABLED) runProjectMapDeltas back to back
  # on a 250ms tick in one warm process. `--rebuild` still needs the one-shot: run
  # `project-td --rebuild` from the `worker` console, then restart this service.
  projector-td:
    image: ${WORKER_IMAGE:-ghcr.io/eps125/railway-live-maps-worker}:${APP_TAG:-latest}
    restart: unless-stopped
    environment: *worker-env
    command: ["node", "dist/index.js", "project-td-daemon"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    stop_grace_period: 15s
    healthcheck:
      disable: true
    networks: [backend]

  # Schedule/TRUST backlog work, deliberately isolated from projector-td (see above) so it can
  # take as long as it needs — large nationwide backlogs, deferred TRUST relinking — without ever
  # blocking live berth positions. vstp and trust are kept together because they have a real
  # sequencing dependency (trust correlates against project-td's output); project-resolver was
  # split out into its own projector-resolver service below on 2026-08-11: resolver's own
  # internal batch loop (up to 25 batches per invocation) could run long enough that vstp/trust
  # barely got a turn in a shared loop — trust-runs' checkpoint was observed advancing roughly
  # every 7-9s instead of every ~1s, risking a resolver pass finding "no candidate yet" for a
  # just-activated train, on top of adding straightforward resolution latency. Each project-*
  # command is checkpointed and incremental, so an idle backlog returns instantly — harmless to
  # leave running even with every *_LIVE_ENABLED flag false.
  projector-schedule:
    image: ${WORKER_IMAGE:-ghcr.io/eps125/railway-live-maps-worker}:${APP_TAG:-latest}
    restart: unless-stopped
    environment: *worker-env
    command:
      - sh
      - -c
      - |
        while true; do
          node dist/index.js project-vstp
          node dist/index.js project-trust
          sleep 1
        done
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      disable: true
    networks: [backend]

  # garner bridge (ADR 0002): mirrors CORPUS/SMART (and, once wired, CIF-schedule + TRUST) from
  # the operator's openrail-eps MariaDB. The daemon idles cleanly if GARNER_BRIDGE_ENABLED is not
  # 'true', so this service is a safe no-op left at the default — flip the flag + set GARNER_DB_*
  # and redeploy to start it. Needs `egress` to reach the openrail-eps host if it's not on the
  # `backend` network.
  ingest-garner:
    image: ${WORKER_IMAGE:-ghcr.io/eps125/railway-live-maps-worker}:${APP_TAG:-latest}
    restart: unless-stopped
    environment: *worker-env
    command: ["node", "dist/index.js", "ingest-garner"]
    depends_on:
      postgres:
        condition: service_healthy
    stop_grace_period: 15s
    healthcheck:
      disable: true
    networks: [backend, egress]

  # Resolver candidate matching, as one persistent process (2026-09 live-path hardening) —
  # replaces the previous `projector-resolver` service's `while true; do node dist/index.js
  # project-resolver; sleep 1; done` loop for the same reason projector-td was daemonised: no
  # per-cycle node cold start. `project-resolver-daemon` runs the normal live loop (forward scan
  # + retry pass, both bounded by RESOLVER_LIVE_WINDOW_HOURS) on a 500ms tick. `--rebuild` /
  # `--backfill` still need the one-shot `project-resolver` command from the `worker` console;
  # both take their own advisory locks so they're safe to run alongside this daemon.
  projector-resolver:
    image: ${WORKER_IMAGE:-ghcr.io/eps125/railway-live-maps-worker}:${APP_TAG:-latest}
    restart: unless-stopped
    environment: *worker-env
    command: ["node", "dist/index.js", "project-resolver-daemon"]
    depends_on:
      postgres:
        condition: service_healthy
    stop_grace_period: 15s
    healthcheck:
      disable: true
    networks: [backend]

  archive:
    # Development default only. Replace with a tested immutable tag/digest before relying
    # on this long-term.
    image: ${MINIO_IMAGE:-minio/minio:latest}
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${RAW_ARCHIVE_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${RAW_ARCHIVE_SECRET_KEY}
    volumes:
      - archive_data:/data
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    networks: [backend]

  postgres:
    image: ${POSTGRES_IMAGE:-postgres:17-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-railway_live_maps}
      POSTGRES_USER: ${POSTGRES_USER:-railway}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: UTC
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-railway} -d ${POSTGRES_DB:-railway_live_maps}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [backend]

  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "no", "--save", ""]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [backend]

volumes:
  postgres_data:
  archive_data:

networks:
  frontend:
  backend:
    internal: true
  # Outbound-only path to the real internet for the services that must reach Network Rail's
  # public endpoints (ingest-td/vstp/trust, and worker for the download-* console commands).
  # Not `internal`, but nothing is published on it either — it grants egress, not any new
  # inbound surface. Postgres/Redis/archive/api/web deliberately stay off this network.
  egress:
