name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  DATABASE_URL: postgresql://railway:railway@localhost:5432/railway_live_maps
  REDIS_URL: redis://localhost:6379
  RAW_ARCHIVE_ENDPOINT: http://localhost:9000
  RAW_ARCHIVE_BUCKET: railway-raw
  RAW_ARCHIVE_ACCESS_KEY: minioadmin
  RAW_ARCHIVE_SECRET_KEY: minioadmin
  RAW_ARCHIVE_REGION: us-east-1
  CAPTURE_ALL_TD: "true"

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: railway_live_maps
          POSTGRES_USER: railway
          POSTGRES_PASSWORD: railway
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U railway -d railway_live_maps"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Format check
        run: pnpm run format:check

      - name: Typecheck
        run: pnpm run typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm run build

      - name: Start MinIO (archive) for connectivity checks
        run: |
          # 2026-09-11: MinIO discontinued free `minio/minio` Docker Hub image distribution in
          # October 2025 — the whole repository (every tag, not just newer ones) now 401s with
          # "pull access denied ... repository does not exist or may require 'docker login'",
          # confirmed live (5 identical failures 10s apart is not a transient rate limit; a
          # pinned pre-October-2025 tag failed identically). `quay.io/minio/minio` is MinIO's
          # own still-working mirror — same image, different registry. See also
          # deploy/docker-compose.portainer.yml and deploy/docker-compose.yml, which had the
          # same now-broken default for the production/dev `archive` service.
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            quay.io/minio/minio server /data
          for i in $(seq 1 30); do
            curl -fs http://localhost:9000/minio/health/live && break
            sleep 1
          done

      - name: Apply database migrations and ensure partitions
        run: node apps/worker/dist/index.js migrate

      - name: Ensure archive bucket
        run: node apps/worker/dist/index.js ensure-archive-bucket

      - name: Worker connectivity check (Postgres, Redis, archive)
        run: node apps/worker/dist/index.js check-connectivity

      - name: Integration tests (Postgres + MinIO)
        run: pnpm run test:integration

      - name: Fixture replay smoke test (no NR credentials involved)
        run: |
          node apps/worker/dist/index.js replay-fixtures multi-area-smoke
          node apps/worker/dist/index.js replay-fixtures redelivery-smoke

      - name: TD projection smoke test (project-td over the replayed fixtures)
        run: node apps/worker/dist/index.js project-td

      - name: Publish the Lancaster test map (Milestone 5 smoke test)
        run: node apps/worker/dist/index.js publish-map lancaster packages/map-schema/fixtures/lancaster-minimal.json

      - name: Build Docker images
        run: |
          docker build -f apps/api/Dockerfile -t railway-live-maps-api:ci .
          docker build -f apps/worker/Dockerfile -t railway-live-maps-worker:ci .
          docker build -f apps/web/Dockerfile -t railway-live-maps-web:ci .

  publish:
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push api image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-api:latest
            ghcr.io/${{ github.repository }}-api:${{ github.sha }}

      - name: Build and push worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/worker/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-worker:latest
            ghcr.io/${{ github.repository }}-worker:${{ github.sha }}

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-web:latest
            ghcr.io/${{ github.repository }}-web:${{ github.sha }}

  deploy:
    # Auto-deploy on green CI (owner decision 2026-09-11, docs/IMPLEMENTATION_PLAN.md Milestone
    # 20). Runs on a self-hosted runner living on the deployment box's own LAN (deploy/docker-
    # compose.runner.yml) rather than a GitHub-hosted one — that box's watchtower HTTP API is
    # published loopback-only, deliberately unreachable from GitHub's cloud runners or anywhere
    # else on the internet. The label here must match RUNNER_LABELS in that compose file.
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, railway-live-maps-deploy]
    steps:
      - name: Trigger watchtower update
        run: |
          curl --fail --show-error --silent -X POST \
            -H "Authorization: Bearer $WATCHTOWER_HTTP_API_TOKEN" \
            http://127.0.0.1:6056/v1/update
        env:
          WATCHTOWER_HTTP_API_TOKEN: ${{ secrets.WATCHTOWER_HTTP_API_TOKEN }}

  cleanup:
    # Owner request 2026-09-20: keep the Actions tab and GHCR from accumulating forever.
    #
    # `always()` so history is pruned even when the run itself failed (a red run is the newest
    # run, so it is always one of the ones kept). `continue-on-error` because housekeeping must
    # never be the reason a green build reports red, and must never block the deploy above it.
    needs: [deploy]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      actions: write
      packages: write

    steps:
      - name: Delete all but the 3 most recent CI runs
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP_RUNS: "3"
        run: |
          # Scoped to this workflow's own runs (not `repos/.../actions/runs`, which is every
          # workflow in the repo) so adding a second workflow later doesn't silently wipe its
          # history too. The API returns newest-first, so "skip the first KEEP_RUNS" is the
          # whole selection rule.
          #
          # Only `completed` runs are deletable — the in-progress run doing the deleting is
          # newest and therefore inside the keep window anyway, but the filter makes that
          # explicit rather than relying on it. A failed delete (a run removed concurrently,
          # say) must not abort the loop, hence the `|| true`.
          gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?per_page=100" \
            --jq '.workflow_runs[] | [.id, .status] | @tsv' \
            | awk -v keep="${KEEP_RUNS}" 'NR > keep && $2 == "completed" { print $1 }' \
            | while read -r run_id; do
                echo "Deleting workflow run ${run_id}"
                gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" || true
              done

      - name: Delete all but the 10 most recent api images
        uses: actions/delete-package-versions@v5
        with:
          package-name: railway-live-maps-api
          package-type: container
          min-versions-to-keep: 10
          token: ${{ secrets.GHCR_CLEANUP_TOKEN || github.token }}

      - name: Delete all but the 10 most recent worker images
        uses: actions/delete-package-versions@v5
        with:
          package-name: railway-live-maps-worker
          package-type: container
          min-versions-to-keep: 10
          token: ${{ secrets.GHCR_CLEANUP_TOKEN || github.token }}

      - name: Delete all but the 10 most recent web images
        uses: actions/delete-package-versions@v5
        with:
          package-name: railway-live-maps-web
          package-type: container
          min-versions-to-keep: 10
          token: ${{ secrets.GHCR_CLEANUP_TOKEN || github.token }}
