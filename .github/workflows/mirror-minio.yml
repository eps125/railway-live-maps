name: Mirror MinIO image

# One-off, manually triggered (2026-09-24). MinIO stopped distributing its image freely: first
# Docker Hub (`minio/minio`, 2026-09-11), then quay.io (`quay.io/minio/minio` now requires a
# login). The deployment box still has the exact image production runs cached, so it is exported
# with `docker save` into this runner's work volume (`minio-mirror/minio.tar`) and pushed from
# here to this repo's GHCR with the workflow's own token — no personal credentials involved.
# Runs on the self-hosted runner only because that is where the exported file lives; the runner
# has no Docker access, so the push uses `crane` (google/go-containerregistry), pinned and
# checksum-verified. The image is unmodified MinIO (AGPLv3); source: github.com/minio/minio.

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  mirror:
    runs-on: [self-hosted, railway-live-maps-deploy]
    env:
      TARBALL: /tmp/runner/work/minio-mirror/minio.tar
      TARGET: ghcr.io/${{ github.repository }}-minio
      CRANE_VERSION: v0.22.1
      CRANE_SHA256: 0ab7a1d6932a213aed964ce97666c3077fe691c8606413674a8b3e0b9ec4cda0
    steps:
      - name: Install crane
        run: |
          curl -fsSL -o crane.tar.gz \
            "https://github.com/google/go-containerregistry/releases/download/${CRANE_VERSION}/go-containerregistry_Linux_x86_64.tar.gz"
          echo "${CRANE_SHA256}  crane.tar.gz" | sha256sum -c -
          tar -xzf crane.tar.gz crane
      - name: Push the exported image to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | ./crane auth login ghcr.io -u "${{ github.actor }}" --password-stdin
          ./crane push "$TARBALL" "$TARGET:upstream"
          # Link the package to this repo so CI's GITHUB_TOKEN can always read it, and record
          # where the image really comes from.
          ./crane mutate "$TARGET:upstream" \
            --label org.opencontainers.image.source=https://github.com/${{ github.repository }} \
            --label "org.opencontainers.image.description=Unmodified MinIO server (AGPLv3, source github.com/minio/minio), mirrored from quay.io/minio/minio:latest as cached on the deployment box" \
            -t "$TARGET:latest"
          echo "Mirrored digest: $(./crane digest "$TARGET:latest")"
