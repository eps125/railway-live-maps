# Pull-only variant of docker-compose.yml for Portainer: no `build:` context, images come
# straight from GHCR. Use this file (not docker-compose.yml) when deploying via Portainer's
# "Repository" stack method pointing at this repo, or by pasting it into the Web editor.
# APP_TAG defaults to `latest` (deploy/.env.example) — a deliberate owner choice for this
# single-operator deployment, not the general production advice docs/ARCHITECTURE.md §8 gives
# (pin to a real commit SHA once you trust a build) for a multi-operator/higher-stakes setup.
#
# Deliberately has no Docker-secret file mounts (no host filesystem access required to
# deploy) — NR_USERNAME/NR_PASSWORD are plain environment variables (Portainer's stack
# environment editor) instead of mounted secret files. Weaker than a mounted secret (visible
# via `docker inspect`/the Portainer UI to anyone with stack access) — see deploy/DEPLOYMENT.md
# §4's caveat. `TD_LIVE_ENABLED` defaults to `true` (deploy/.env.example) — a deliberate owner
# choice once the TD feed was confirmed working against real NR; NR_USERNAME/NR_PASSWORD must
# still be set in Portainer's stack environment editor for it to connect (loadConfig fails fast
# otherwise).
#
# `worker` itself stays an idle daemon (its default command) — it's the stable target for
# Portainer's "Console" one-off commands (migrate, ensure-archive-bucket, publish-map, ...).
# Live TD capture runs in the `ingest-td` service; it idles (`sleep infinity`) unless
# TD_LIVE_ENABLED is true, so leaving it at the default is a safe no-op rather than a crash loop.
# `projector-td` runs a persistent daemon (`project-td-daemon`, 2026-09 live-path hardening) that
# ticks every 250ms in one warm process — no per-cycle `node` cold start. `ingest-garner`
# (ADR 0002) mirrors CORPUS / SMART / CIF-schedule / TRUST from the operator's openrail-eps
# MariaDB — RLM no longer subscribes to Network Rail for VSTP or TRUST, and the `ingest-vstp` /
# `ingest-trust` / `projector-schedule` / `projector-resolver` services were removed.
#
# Postgres/Redis/archive are published to the host below for direct testing access — this
# is a deliberate departure from docs/ARCHITECTURE.md §12 ("only the reverse proxy/web entry
# point should be public"; internal services stay off the internal `backend` network's
# public surface otherwise). Fine for a single-operator testing/staging box; put these
# behind a firewall or VPN rather than a raw public IP, and don't reuse this file as-is for
# a production deployment without reconsidering that tradeoff.
#
# `backend` is `internal: true` (no route to the outside world at all — not even DNS), which
# is right for Postgres/Redis/archive/api/web but would silently break `worker`, `ingest-td`,
# `reference-data-refresh` and `ingest-garner`: they need to actually reach
# publicdatafeeds.networkrail.co.uk (or the openrail-eps host). Those services are additionally
# attached to `egress`, a normal (non-internal) network that grants outbound internet without
# publishing anything new inbound — see its definition below.

name: railway-live-maps

x-worker-env: &worker-env
  APP_ENV: ${APP_ENV:-production}
  DATABASE_URL: ${DATABASE_URL}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379}
  CAPTURE_ALL_TD: ${CAPTURE_ALL_TD:-true}
  RAW_ARCHIVE_ENDPOINT: ${RAW_ARCHIVE_ENDPOINT:-http://archive:9000}
  RAW_ARCHIVE_BUCKET: ${RAW_ARCHIVE_BUCKET:-railway-raw}
  RAW_ARCHIVE_ACCESS_KEY: ${RAW_ARCHIVE_ACCESS_KEY}
  RAW_ARCHIVE_SECRET_KEY: ${RAW_ARCHIVE_SECRET_KEY}
  RAW_ARCHIVE_REGION: ${RAW_ARCHIVE_REGION:-us-east-1}
  NR_TD_TOPIC: ${NR_TD_TOPIC:-/topic/TD_ALL_SIG_AREA}
  # Real values go in Portainer's stack environment editor, never in this file or Git.
  NR_USERNAME: ${NR_USERNAME:-}
  NR_PASSWORD: ${NR_PASSWORD:-}
  TD_LIVE_ENABLED: ${TD_LIVE_ENABLED:-true}
  # VSTP_LIVE_ENABLED / TRUST_LIVE_ENABLED / NR_VSTP_TOPIC / NR_TRUST_TOPIC / NR_SCHEDULE_DOWNLOAD_URL
  # were removed with ADR 0002 (2026-09-01): RLM no longer subscribes to NR for VSTP/TRUST/SCHEDULE
  # — that data is mirrored from openrail-eps by `ingest-garner`. Drop them from any existing stack .env.
  # CORPUS/SMART full-extract download is still supported as the non-garner fallback.
  NR_CORPUS_DOWNLOAD_URL: ${NR_CORPUS_DOWNLOAD_URL:-https://publicdatafeeds.networkrail.co.uk/ntrod/SupportingFileAuthenticate?type=CORPUS}
  NR_SMART_DOWNLOAD_URL: ${NR_SMART_DOWNLOAD_URL:-https://publicdatafeeds.networkrail.co.uk/ntrod/SupportingFileAuthenticate?type=SMART}
  # Gates the manual download-{corpus,smart} console commands AND the daily reference-data-refresh
  # service below. (Still named SCHEDULE_DOWNLOAD_ENABLED for compatibility; the SCHEDULE part is gone.)
  SCHEDULE_DOWNLOAD_ENABLED: ${SCHEDULE_DOWNLOAD_ENABLED:-true}
  # Europe/London wall-clock time (24h HH:MM) the reference-data-refresh service runs
  # download-smart / download-corpus at, once a day. Only takes effect while
  # SCHEDULE_DOWNLOAD_ENABLED is true — see that service's own comment.
  REFERENCE_DATA_REFRESH_TIME: ${REFERENCE_DATA_REFRESH_TIME:-01:00}
  # Must match the `api` service's own copy of this flag below — and gates whether
  # `project-td-daemon` publishes map deltas to Redis after each projection tick (see the
  # projector-td service and docs/ARCHITECTURE.md's Milestone 6 note). On: the WebSocket layer
  # gets pushed deltas over Redis pub/sub instead of polling Postgres, which is what actually
  # makes the map feel live rather than merely "polls a bit faster."
  LIVE_WS_REDIS_PUBSUB_ENABLED: ${LIVE_WS_REDIS_PUBSUB_ENABLED:-true}
  # garner bridge (ADR 0002): the `ingest-garner` service mirrors CORPUS/SMART (and, once wired,
  # CIF-schedule + TRUST) from the operator's openrail-eps MariaDB instead of RLM subscribing to
  # Network Rail a second time. Off by default. When true, GARNER_DB_* must be set in Portainer's
  # stack env and should be a read-only user (openrail-eps docker/README "External read access").
  GARNER_BRIDGE_ENABLED: ${GARNER_BRIDGE_ENABLED:-false}
  GARNER_DB_HOST: ${GARNER_DB_HOST:-}
  GARNER_DB_PORT: ${GARNER_DB_PORT:-3306}
  GARNER_DB_NAME: ${GARNER_DB_NAME:-rail}
  GARNER_DB_USER: ${GARNER_DB_USER:-}
  GARNER_DB_PASSWORD: ${GARNER_DB_PASSWORD:-}
  GARNER_BRIDGE_BACKFILL_DAYS: ${GARNER_BRIDGE_BACKFILL_DAYS:-14}
  # The berth-run resolver was removed with ADR 0002 (2026-09-01); its RESOLVER_* knobs
  # (RESOLVER_EAGER_MAPPED_AREAS_ONLY, RESOLVER_LIVE_WINDOW_HOURS) are gone. Drop them from any
  # existing stack .env.

services:
  web:
    image: ${WEB_IMAGE:-ghcr.io/eps125/railway-live-maps-web}:${APP_TAG:-latest}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-6050}:80"
    networks: [frontend, backend]

  api:
    image: ${API_IMAGE:-ghcr.io/eps125/railway-live-maps-api}:${APP_TAG:-latest}
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-production}
      # Internal container listen port — NOT the same thing as API_PORT below (which is only
      # the host-side publish mapping, hardcoded to forward to container port 3000). Leave
      # PORT at 3000: apps/web/nginx.conf's `proxy_pass http://api:3000` is hardcoded to that
      # value, so changing PORT here breaks the web->api proxy with a 502, even though the
      # api container itself comes up healthy.
      PORT: ${PORT:-3000}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      DISPLAY_TIMEZONE: ${DISPLAY_TIMEZONE:-Europe/London}
      EDITOR_ENABLED: ${EDITOR_ENABLED:-true}
      # Must match the worker-side copy of this flag (x-worker-env above) — if only one side
      # has it on, deltas either never get published or never get subscribed to.
      LIVE_WS_REDIS_PUBSUB_ENABLED: ${LIVE_WS_REDIS_PUBSUB_ENABLED:-true}
      # Previously missing from this block entirely (apps/api/src/config.ts has both with safe
      # defaults, so nothing broke — but Portainer's environment editor couldn't actually
      # override them). LIVE_WS_POLL_INTERVAL_MS is also the fallback poll interval when
      # LIVE_WS_REDIS_PUBSUB_ENABLED is false.
      LIVE_WS_POLL_INTERVAL_MS: ${LIVE_WS_POLL_INTERVAL_MS:-1000}
      LIVE_WS_HEARTBEAT_INTERVAL_MS: ${LIVE_WS_HEARTBEAT_INTERVAL_MS:-15000}
    ports:
      - "${API_PORT:-6051}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "dist/healthcheck.js"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [backend]

  worker:
    image: ${WORKER_IMAGE:-ghcr.io/eps125/railway-live-maps-worker}:${APP_TAG:-latest}
    restart: unless-stopped
    environment: *worker-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      archive:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "dist/healthcheck.js"]
      interval: 30s
      timeout: 5s
      retries: 5
    # `egress` (not `internal`-only): this is also the console target for one-off
    # `download-schedule`/`download-corpus`/`download-smart` commands, which reach
    # publicdatafeeds.networkrail.co.uk directly — same requirement as the ingest-* services.
    networks: [backend, egress]

  # Always running; idles (sleep infinity) unless TD_LIVE_ENABLED=true, in which case it
  # connects to the real Network Rail TD feed. Flip the flag and redeploy this service (no
  # image change needed) to start/stop live capture.
  ingest-td:
    image: ${WORKER_IMAGE:-ghcr.io/eps125/railway-live-maps-worker}:${APP_TAG:-latest}
    restart: unless-stopped
    environment: *worker-env
    command:
      - sh
      - -c
      - |
        if [ "$$TD_LIVE_ENABLED" = "true" ]; then
          exec node dist/index.js ingest-td
        else
          echo "ingest-td: TD_LIVE_ENABLED is not true, idling"
          exec sleep infinity
        fi
    depends_on:
      postgres:
        condition: service_healthy
      archive:
        condition: service_started
    # The image's baked-in HEALTHCHECK reads a heartbeat file only the idle `serve` role
    # writes — it does not apply to this role, so it's disabled here rather than showing a
    # permanently "unhealthy" status for a container that's actually working correctly.
    healthcheck:
      disable: true
    # `egress` (not `internal`) is required here — this is the one role that must reach the
    # real internet (Network Rail's public STOMP endpoint). `backend`-only would leave it
    # unable to resolve any hostname at all (DNS EAI_AGAIN), not merely blocked.
    networks: [backend, egress]

  # The `ingest-vstp` and `ingest-trust` services were removed with ADR 0002 (2026-09-01): RLM no
  # longer subscribes to Network Rail for VSTP or TRUST. VSTP-schedule and TRUST data are mirrored
  # from the operator's openrail-eps ("garner") MariaDB by the `ingest-garner` service below. If
  # `ingest-vstp` / `ingest-trust` from an earlier stack version are still defined in Portainer,
  # delete them on the next redeploy.

  # Automatically re-downloads/re-imports SMART and CORPUS once a day at
  # REFERENCE_DATA_REFRESH_TIME (Europe/London, default 01:00). Idles (sleep infinity) unless
  # SCHEDULE_DOWNLOAD_ENABLED=true, same pattern as ingest-td above — flip the flag and redeploy
  # to start automatic daily refreshes. A failed night is logged and retried the following day
  # rather than crash-looping the container (apps/worker/src/commands/scheduleReferenceRefresh.ts).
  # (When GARNER_BRIDGE_ENABLED, `ingest-garner` mirrors CORPUS/SMART from openrail-eps too — this
  # service is then redundant but harmless.)
  reference-data-refresh:
    image: ${WORKER_IMAGE:-ghcr.io/eps125/railway-live-maps-worker}:${APP_TAG:-latest}
    restart: unless-stopped
    environment: *worker-env
    command:
      - sh
      - -c
      - |
        if [ "$$SCHEDULE_DOWNLOAD_ENABLED" = "true" ]; then
          exec node dist/index.js schedule-reference-refresh
        else
          echo "reference-data-refresh: SCHEDULE_DOWNLOAD_ENABLED is not true, idling"
          exec sleep infinity
        fi
    depends_on:
      postgres:
        condition: service_healthy
      archive:
        condition: service_started
    healthcheck:
      disable: true
    # `egress` (not `internal`): reaches publicdatafeeds.networkrail.co.uk directly, same
    # requirement as ingest-td and the worker service's own console commands.
    networks: [backend, egress]

  # THE HOT PATH (ADR 0003 / Milestone 16). Reads TD CA/CB/CC from raw_feed_event in tiny
  # batches on a 100ms tick, writes berth_current_state in one bulk upsert, and publishes the
  # WebSocket layer's Redis deltas — nothing else. This is what makes end-to-end latency
  # sub-second. Needs LIVE_WS_REDIS_PUBSUB_ENABLED for the delta publish (otherwise it still
  # keeps berth_current_state fresh for the API's polling fallback).
  projector-td-live:
    image: ${WORKER_IMAGE:-ghcr.io/eps125/railway-live-maps-worker}:${APP_TAG:-latest}
    restart: unless-stopped
    environment: *worker-env
    command: ["node", "dist/index.js", "project-td-live-daemon"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    stop_grace_period: 15s
    healthcheck:
      disable: true
    networks: [backend]

  # The NON-hot-path TD projector (ADR 0003): td_berth_event, berth_occupancy history, S-Class,
  # anomalies, td_area_summary, td_heartbeat. Seconds of lag here don't matter. It also writes
  # berth_current_state (monotonic-guarded) as the catch-up / --rebuild path, but no longer
  # publishes deltas — projector-td-live does that. 250ms tick. `--rebuild` still needs the
  # one-shot: run `project-td --rebuild` from the `worker` console (it also resets the live
  # projector's checkpoint), then restart both projector-td services.
  projector-td:
    image: ${WORKER_IMAGE:-ghcr.io/eps125/railway-live-maps-worker}:${APP_TAG:-latest}
    restart: unless-stopped
    environment: *worker-env
    command: ["node", "dist/index.js", "project-td-daemon"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    stop_grace_period: 15s
    healthcheck:
      disable: true
    networks: [backend]

  # The `projector-schedule` service (which ran `project-vstp` / `project-trust` in a shell loop)
  # was removed with ADR 0002 (2026-09-01) along with RLM's own VSTP/TRUST projectors. Delete it
  # from Portainer on the next redeploy if an earlier stack version still defines it.

  # garner bridge (ADR 0002): mirrors CORPUS / SMART / cif_schedules / cif_schedule_locations /
  # trust_* from the operator's openrail-eps MariaDB — RLM no longer subscribes to Network Rail
  # for those feeds. The daemon idles cleanly if GARNER_BRIDGE_ENABLED is not 'true', so this
  # service is a safe no-op left at the default — flip the flag + set GARNER_DB_* and redeploy to
  # start it. Needs `egress` to reach the openrail-eps host if it's not on the `backend` network.
  ingest-garner:
    image: ${WORKER_IMAGE:-ghcr.io/eps125/railway-live-maps-worker}:${APP_TAG:-latest}
    restart: unless-stopped
    environment: *worker-env
    command: ["node", "dist/index.js", "ingest-garner"]
    depends_on:
      postgres:
        condition: service_healthy
    stop_grace_period: 15s
    healthcheck:
      disable: true
    networks: [backend, egress]

  # The berth-run resolver (`projector-resolver` / `project-resolver-daemon`) was removed with
  # ADR 0002 (2026-09-01). Run<->schedule correlation on the live map is deferred to a later
  # phase that will source it from the garner (openrail-eps) `trust_*` mirror. If a
  # `projector-resolver` service from an earlier stack version is still defined in Portainer,
  # delete it on the next redeploy.

  archive:
    # Development default only. Replace with a tested immutable tag/digest before relying
    # on this long-term.
    image: ${MINIO_IMAGE:-minio/minio:latest}
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${RAW_ARCHIVE_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${RAW_ARCHIVE_SECRET_KEY}
    volumes:
      - archive_data:/data
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    networks: [backend]

  postgres:
    image: ${POSTGRES_IMAGE:-postgres:17-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-railway_live_maps}
      POSTGRES_USER: ${POSTGRES_USER:-railway}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: UTC
    # Tuning (2026-09-01): the stock image ships `shared_buffers=128MB`, which on this
    # single-box deployment (RLM + openrail-eps + MinIO sharing ~8GB) meant the live-path
    # working set and the garner `cif_schedule_locations` mirror couldn't stay cached together,
    # so a bulk write starved `projector-td`. These `-c` flags override any `ALTER SYSTEM`
    # (`postgresql.auto.conf`) settings, so change values HERE from now on, not via SQL. Every
    # value is env-overridable for a box with more/less RAM — bump SHARED_BUFFERS to ~4GB and
    # EFFECTIVE_CACHE_SIZE to ~10GB on a 16GB host. RANDOM_PAGE_COST / EFFECTIVE_IO_CONCURRENCY
    # assume SSD/NVMe — raise RANDOM_PAGE_COST back to 4 and drop the concurrency on spinning disk.
    command:
      - postgres
      - -c
      - shared_buffers=${PG_SHARED_BUFFERS:-2GB}
      - -c
      - effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE:-5GB}
      - -c
      - maintenance_work_mem=${PG_MAINTENANCE_WORK_MEM:-512MB}
      - -c
      - work_mem=${PG_WORK_MEM:-48MB}
      - -c
      - wal_compression=${PG_WAL_COMPRESSION:-on}
      - -c
      - max_wal_size=${PG_MAX_WAL_SIZE:-4GB}
      - -c
      - min_wal_size=${PG_MIN_WAL_SIZE:-1GB}
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - random_page_cost=${PG_RANDOM_PAGE_COST:-1.1}
      - -c
      - effective_io_concurrency=${PG_EFFECTIVE_IO_CONCURRENCY:-200}
    shm_size: ${PG_SHM_SIZE:-512mb}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-railway} -d ${POSTGRES_DB:-railway_live_maps}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [backend]

  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "no", "--save", ""]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [backend]

volumes:
  postgres_data:
  archive_data:

networks:
  frontend:
  backend:
    internal: true
  # Outbound-only path to the real internet for the services that must reach external endpoints
  # (ingest-td and worker for the download-* console commands → Network Rail; ingest-garner →
  # the openrail-eps host). Not `internal`, but nothing is published on it either — it grants
  # egress, not any new inbound surface. Postgres/Redis/archive/api/web stay off this network.
  egress:
