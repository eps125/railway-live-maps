name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  DATABASE_URL: postgresql://railway:railway@localhost:5432/railway_live_maps
  REDIS_URL: redis://localhost:6379
  RAW_ARCHIVE_ENDPOINT: http://localhost:9000
  RAW_ARCHIVE_BUCKET: railway-raw
  RAW_ARCHIVE_ACCESS_KEY: minioadmin
  RAW_ARCHIVE_SECRET_KEY: minioadmin
  RAW_ARCHIVE_REGION: us-east-1
  CAPTURE_ALL_TD: "true"

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: railway_live_maps
          POSTGRES_USER: railway
          POSTGRES_PASSWORD: railway
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U railway -d railway_live_maps"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Format check
        run: pnpm run format:check

      - name: Typecheck
        run: pnpm run typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm run build

      - name: Start MinIO (archive) for connectivity checks
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio server /data
          for i in $(seq 1 30); do
            curl -fs http://localhost:9000/minio/health/live && break
            sleep 1
          done

      - name: Apply database migrations and ensure partitions
        run: node apps/worker/dist/index.js migrate

      - name: Ensure archive bucket
        run: node apps/worker/dist/index.js ensure-archive-bucket

      - name: Worker connectivity check (Postgres, Redis, archive)
        run: node apps/worker/dist/index.js check-connectivity

      - name: Integration tests (Postgres + MinIO)
        run: pnpm run test:integration

      - name: Fixture replay smoke test (no NR credentials involved)
        run: |
          node apps/worker/dist/index.js replay-fixtures multi-area-smoke
          node apps/worker/dist/index.js replay-fixtures redelivery-smoke

      - name: Build Docker images
        run: |
          docker build -f apps/api/Dockerfile -t railway-live-maps-api:ci .
          docker build -f apps/worker/Dockerfile -t railway-live-maps-worker:ci .
          docker build -f apps/web/Dockerfile -t railway-live-maps-web:ci .

  publish:
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push api image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-api:latest
            ghcr.io/${{ github.repository }}-api:${{ github.sha }}

      - name: Build and push worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/worker/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-worker:latest
            ghcr.io/${{ github.repository }}-worker:${{ github.sha }}

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-web:latest
            ghcr.io/${{ github.repository }}-web:${{ github.sha }}
