# Fastify's live map route (GET /api/v1/maps/:slug/live, registered with { websocket: true })
# is proxied through the same /api/ location as every other REST call below — there's no
# separate /ws path on the backend. $connection_upgrade forwards "Connection: upgrade" only
# when the client actually asked to upgrade, so ordinary REST requests through /api/ keep
# working unchanged.
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        # No trailing slash after the port: nginx forwards the original URI (including
        # the /api prefix) unchanged. All real API routes are registered at /api/v1/...
        # (only /health/live and /health/ready are unprefixed) — a trailing slash here
        # would strip /api before proxying, so every /api/v1/... request 404s at Fastify
        # even though the process is healthy and listening.
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
